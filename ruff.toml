# Lint for bugs and security; layout comes from `ruff format` (checked in CI).
# % formatting in HTML templates is kept on purpose (UP031 off).
# Run: ruff format scripts tests && ruff check scripts tests
target-version = "py310"
line-length = 130

[lint]
select = [
  "F",    # pyflakes: undefined names, unused imports
  "E4", "E7", "E9",  # import placement, syntax-level errors
  "B",    # bugbear: likely bugs
  "S",    # bandit: security
  "PLE", "PLW",  # pylint errors and warnings
  "BLE",  # blind except
  "C4",   # comprehensions
  "RUF",  # ruff-specific
  "UP",   # pyupgrade
]
ignore = [
  "E731", "E741",  # named lambdas and short names like l are left for later PRs
  "UP031",   # % formatting in HTML templates
  "RUF005",  # [a] + b is clearer here than unpacking
  "S603",    # subprocess without a shell; arguments are lists and refs are validated
  "S607",    # git is looked up on PATH on purpose
  "PLW1510", # subprocess.run without check: return codes are handled explicitly
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S105", "E402"]
