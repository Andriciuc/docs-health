# Tests the scripts, builds the docs site, and runs both reusable workflows on every PR and push to main.
# Smoke runs open no issues and keep artifacts for 1 day.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Lint (bugs and security rules, see ruff.toml)
        run: ruff check --output-format github scripts tests
      - name: Known vulnerabilities in pinned dependencies
        run: pip-audit --progress-spinner off -r requirements-ci.txt -r requirements-docs.txt
      - run: python -m unittest discover -s tests -v

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt -r requirements-run.txt
      - name: Strict build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - name: Metadata check (docs-health on its own docs)
        run: |
          python -I scripts/metadata_check.py docs --glob '**/*.md' --out /tmp/meta --title-template '{title} - docs-health'
          python -I -c "import csv,sys; bad=[r for r in csv.DictReader(open('/tmp/meta/metadata.csv')) if r['worst'] in ('error','warn')]; [print('::error file=docs/%s::%s' % (r['path'], r['issues'])) for r in bad]; sys.exit(1 if bad else 0)"

  coverage-smoke:
    needs: unit
    uses: ./.github/workflows/docs-coverage.yml
    with:
      profile: valkey                     # built-in name
      docs_repo: valkey-io/valkey-doc
      code_repo: valkey-io/valkey
      code_ref: latest-tag
      name: ci-coverage
      retention_days: 1
      skill_repo: ${{ github.repository }}
      skill_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  coverage-profile-path-smoke:
    needs: unit
    uses: ./.github/workflows/docs-coverage.yml
    with:
      profile: ./profiles/valkey.yml      # profile file in the calling repo
      docs_repo: valkey-io/valkey-doc
      code_repo: valkey-io/valkey
      code_ref: unstable
      name: ci-coverage-path
      retention_days: 1
      skill_repo: ${{ github.repository }}
      skill_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  compare-smoke:
    needs: unit
    uses: ./.github/workflows/docs-compare.yml
    with:
      a_repo: valkey-io/valkey-doc
      a_ref: main
      b_repo: Andriciuc/valkey-doc
      b_ref: main
      inventory_args: "--docs-dir . --type-rule 'commands/*.md=reference'"
      history: false
      name: ci-compare
      retention_days: 1
      skill_repo: ${{ github.repository }}
      skill_ref: ${{ github.event.pull_request.head.sha || github.sha }}
