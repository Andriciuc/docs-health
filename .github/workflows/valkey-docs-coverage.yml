# Runs the docs coverage checks from this repo. Report issues open here.
# Runs monthly and on demand; opens one issue assigned to the owner.
# Template for other repos: examples/valkey-docs-coverage.yml
name: Docs coverage

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      docs_ref:
        description: valkey-doc branch
        default: main
      code_ref:
        description: valkey branch or tag (match the release the docs target)
        default: unstable

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    uses: ./.github/workflows/docs-coverage.yml
    with:
      docs_repo: Andriciuc/valkey-doc
      docs_ref: ${{ inputs.docs_ref || 'main' }}
      code_repo: Andriciuc/valkey
      code_ref: ${{ inputs.code_ref || 'unstable' }}
      assignee: Andriciuc
