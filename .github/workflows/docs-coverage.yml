# Reusable workflow: check a docs tree against the source code it documents.
# Callers define their own pairs (docs repo/ref vs code repo/ref); see examples/.
# Deterministic: no AI step, no PRs. Results: run summary, an artifact with
# report.html + CSVs, and (optional) one issue per run for a person to triage.
#
# What counts as documentable comes from a profile: a built-in name (profiles/*.yml,
# e.g. "valkey") or "./path/to/profile.yml" in the calling repo. Format:
# https://andriciuc.github.io/docs-health/checks/write-a-profile/
#
# Security: inputs reach shell steps only through env vars; actions are pinned to
# commit SHAs; checkouts don't persist credentials; the analysis job is read-only;
# the optional issue job inherits the caller's grant (needs issues: write).
name: docs-coverage

on:
  workflow_call:
    inputs:
      docs_repo:
        description: Docs repo (owner/name)
        type: string
        required: true
      docs_ref:
        description: Docs branch, tag or commit
        type: string
        default: main
      code_repo:
        description: Code repo (owner/name)
        type: string
        required: true
      code_ref:
        description: Code branch, tag or commit, or "latest-tag" for the newest X.Y.Z release tag
        type: string
        default: latest-tag
      profile:
        description: Built-in profile name (e.g. "valkey") or "./path/to/profile.yml" in the calling repo
        type: string
        required: true
      open_issue:
        description: Open a report issue in the calling repo
        type: boolean
        default: false
      assignee:
        description: GitHub user to assign the issue to (empty = unassigned)
        type: string
        default: ""
      name:
        description: Short label for this pair, used in titles and artifact names
        type: string
        default: ""
      retention_days:
        type: number
        default: 30
      skill_repo:
        type: string
        default: Andriciuc/docs-health
      skill_ref:
        description: Pin to a tag or commit for reproducible runs
        type: string
        default: v1

# No top-level permissions: the caller's grant is the ceiling. Jobs narrow it.

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      title: ${{ steps.meta.outputs.title }}
      artifact: ${{ steps.meta.outputs.artifact }}
    env:
      DOCS_REPO: ${{ inputs.docs_repo }}
      DOCS_REF: ${{ inputs.docs_ref }}
      CODE_REPO: ${{ inputs.code_repo }}
      CODE_REF_IN: ${{ inputs.code_ref }}
      PROFILE: ${{ inputs.profile }}
      PAIR_NAME: ${{ inputs.name }}
      ASSIGNEE: ${{ inputs.assignee }}
    steps:
      - name: Validate inputs
        id: inputs
        run: |
          repo_re='^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$'
          ref_re='^[A-Za-z0-9._/+-]{1,200}$'
          fail() { echo "::error::$1"; exit 1; }
          [[ "$DOCS_REPO" =~ $repo_re ]] || fail "docs_repo must be owner/name"
          [[ "$CODE_REPO" =~ $repo_re ]] || fail "code_repo must be owner/name"
          for r in "$DOCS_REF" "$CODE_REF_IN"; do
            [[ "$r" =~ $ref_re && "$r" != -* && "$r" != *..* ]] || fail "unsafe ref: $r"
          done
          [[ -z "$ASSIGNEE" || "$ASSIGNEE" =~ ^[A-Za-z0-9-]{1,39}$ ]] || fail "assignee must be a GitHub login"
          if [[ "$PROFILE" == ./* ]]; then
            [[ "$PROFILE" =~ ^\./[A-Za-z0-9._/-]+\.ya?ml$ && "$PROFILE" != *..* ]] || fail "profile path must be ./something.yml inside the calling repo"
            echo "profile_rel=${PROFILE#./}" >> "$GITHUB_OUTPUT"   # sparse patterns can't start with ./
          else
            [[ "$PROFILE" =~ ^[A-Za-z0-9_-]{1,50}$ ]] || fail "profile must be a built-in name or ./path.yml"
          fi

      - name: Resolve code ref
        id: ref
        run: |
          ref="$CODE_REF_IN"
          if [[ "$ref" == "latest-tag" ]]; then
            ref=$(git ls-remote --tags --refs "https://github.com/${CODE_REPO}.git" \
                  | sed 's#.*refs/tags/##' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [[ -n "$ref" ]] || { echo "::error::no X.Y.Z tags in $CODE_REPO"; exit 1; }
          fi
          echo "code_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Code ref: $ref"

      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.skill_repo }}
          ref: ${{ inputs.skill_ref }}
          path: skill
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ ! -f skill/requirements-run.txt ]; then
            echo "::error::skill_ref has no requirements-run.txt (older than v1.0.3). Set skill_ref to the same version as the @ref you call."
            exit 1
          fi
          python -m pip install --disable-pip-version-check -r skill/requirements-run.txt

      - name: Self-test
        run: python -m unittest discover -s skill/tests

      - name: Check out profile from the calling repo
        if: ${{ startsWith(inputs.profile, './') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
          sparse-checkout: ${{ steps.inputs.outputs.profile_rel }}
          sparse-checkout-cone-mode: false

      - name: Load profile
        id: profile
        run: |
          if [[ "$PROFILE" == ./* ]]; then file="caller/${PROFILE#./}"; else file="$PROFILE"; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          paths=$(python -I skill/scripts/profile_coverage.py "$file" --print-sparse)
          delim="EOF_$(openssl rand -hex 8)"
          { echo "sparse<<$delim"; printf '%s\n' "$paths"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          echo "Profile: $file"; printf 'Sparse paths:\n%s\n' "${paths:-(full checkout)}"

      - name: Check out docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.docs_repo }}
          ref: ${{ inputs.docs_ref }}
          path: docs
          persist-credentials: false

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.code_repo }}
          ref: ${{ steps.ref.outputs.code_ref }}
          path: code
          persist-credentials: false
          sparse-checkout: ${{ steps.profile.outputs.sparse }}
          sparse-checkout-cone-mode: false

      - name: Run coverage
        env:
          PROFILE_FILE: ${{ steps.profile.outputs.file }}
        run: python -I skill/scripts/profile_coverage.py "$PROFILE_FILE" --code code --docs docs --out cov

      - name: Name this run
        id: meta
        env:
          CODE_REF: ${{ steps.ref.outputs.code_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          label="${PAIR_NAME:-${DOCS_REPO#*/}@${DOCS_REF} vs ${CODE_REPO#*/}@${CODE_REF}}"
          slug=$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-' | tr -s '-' | cut -c1-60)
          echo "title=Docs coverage $(date -u +%Y-%m-%d): $label" >> "$GITHUB_OUTPUT"
          echo "artifact=docs-coverage-${slug}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "LABEL=$label" >> "$GITHUB_ENV"

      - name: Build reports
        env:
          CODE_REF: ${{ steps.ref.outputs.code_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -I skill/scripts/html_report.py cov --title "Docs coverage: $LABEL"
          {
            echo "Docs: \`${DOCS_REPO}@${DOCS_REF}\` · Code: \`${CODE_REPO}@${CODE_REF}\` · [Run, report.html and CSV data](${RUN_URL})"
            echo
            echo "Status: **needs triage**. Findings are candidates; confirm each against the source before acting."
            echo
            sed '1d' cov/coverage_summary.md
            for extra in cov/nav_summary.md; do
              [[ -f "$extra" ]] && { echo; sed '1d' "$extra"; }
            done
          } > cov/issue_body.md
          head -c 60000 cov/issue_body.md > cov/issue_body.trimmed.md
          mv cov/issue_body.trimmed.md cov/issue_body.md
          cat cov/issue_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: cov/
          retention-days: ${{ inputs.retention_days }}

  issue:
    needs: coverage
    if: ${{ inputs.open_issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No permissions key: this job inherits what the caller grants, so callers that
    # don't open issues never have to grant issues: write. Callers that do must.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.coverage.outputs.artifact }}
          path: cov
      - name: Open report issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ needs.coverage.outputs.title }}
          ASSIGNEE: ${{ inputs.assignee }}
        run: |
          args=(--repo "$REPO" --title "$TITLE" --body-file cov/issue_body.md)
          [[ -n "$ASSIGNEE" ]] && args+=(--assignee "$ASSIGNEE")
          gh issue create "${args[@]}"
